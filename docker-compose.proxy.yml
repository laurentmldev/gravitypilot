# Overlay for running behind nginx-proxy (or any proxy that finds containers
# through VIRTUAL_HOST on a shared Docker network). Enable it with, in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   VIRTUAL_HOST=game.example.com
#   PROXY_NETWORK=<the network nginx-proxy is attached to>
services:
  gravitypilot:
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:?set VIRTUAL_HOST to the public host name}
      VIRTUAL_PORT: ${APP_PORT:-8080}
    # nginx-proxy can only forward to containers on a network it is attached to.
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
